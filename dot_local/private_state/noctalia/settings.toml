[desktop_widgets]
enabled = false

[dock]
active_monitor_only = true
auto_hide = true
background_opacity = 0.90999997965991497
enabled = true
icon_size = 31
launcher_position = "start"
magnification_scale = 1.2500000037252903
margin_edge = 4
reserve_space = false
show_dots = true
show_instance_count = false

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 5

    [idle.behavior.lock]
    action = "lock"
    enabled = false
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 6000.0

[location]
auto_locate = true

[lockscreen]
