config_version = 16

[accessibility]
ui_scale = 0.95000000670552254

[bar]
order = [ "default", "topbar" ]

    [bar.default]
    background_opacity = 0.93999997898936272
    center = [ "workspaces" ]
    concave_edge_corners = true
    end = [ "widget", "tray", "notifications", "network", "bluetooth", "volume", "brightness", "control-center" ]
    font_weight = 700
    margin_edge = 0
    margin_ends = 0
    padding = 12
    position = "left"
    radius = 0
    radius_bottom_right = 60
    radius_top_right = 60
    scale = 1.1000000089406967
    start = [ "launcher", "recorder", "clipboard", "sysmon", "cat_2", "media", "audio_visualizer", "clock" ]
    thickness = 42
    widget_spacing = 15

    [bar.topbar]
    background_opacity = 0.95999997854232788
    enabled = false
    margin_ends = 0
    radius = 0

[brightness]
