[notification]
layer = "overlay"

[plugin_settings."noctalia/translator"]
target_lang = "cn"

[plugins]
enabled = [
    "noctalia/kaomoji",
    "noctalia/screen_recorder",
    "antigravity/clipboard-osd",
    "noctalia/translator",
    "h465855hgg/lyrics",
    "dotnetrob/cat",
    "joshuaslate/shelly",
    "lanrhyme/micyou"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "path"
    location = "/home/lanrhyme/.config/noctalia/plugins"
    name = "my-local"

[shell]
avatar_path = "/home/lanrhyme/图片/headportrait.png"
corner_radius_scale = 2.0
font_family = "HarmonyOS Sans"
screen_time_enabled = true
settings_show_advanced = true
telemetry_enabled = true

    [shell.animation]
    speed = 0.60000000894069672

    [shell.launcher]
    app_grid = true

    [shell.panel]
    borders = false
    launcher_placement = "attached"

    [shell.screen_corners]
    size = 16

    [shell.shadow]
    alpha = 0.92999997921288013
    direction = "down_right"

[theme]
source = "wallpaper"
wallpaper_scheme = "muted"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kcolorscheme", "qt" ]
    community_ids = [ "antigravity", "steam" ]

[wallpaper]
directory = "/home/lanrhyme/图片/WallPapers"
edge_smoothness = 0.0
transition = [ "disc" ]
transition_duration = 2300
transition_on_startup = true

    [wallpaper.default]
    path = "/home/lanrhyme/图片/WallPapers/kita.png"

    [wallpaper.last]
    path = "/home/lanrhyme/图片/WallPapers/kita.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/lanrhyme/图片/WallPapers/0AC05BDD4AD6BF1001C952501B00DFD3.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/lanrhyme/图片/WallPapers/kita.png"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/lanrhyme/图片/WallPapers/kita.png"
    theme_mode = "dark"
    wallpaper_scheme = "muted"

[widget.audio_visualizer]
bands = 46
mirrored = false

[widget.bluetooth]
enabled = false

[widget.brightness]
show_label = false

[widget.cat_2]
