# Mango Window Manager Configuration
# Migrated from Niri config

# --- Window Visuals & Effects ---
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2

shadows=1
layer_shadows=0
shadow_only_floating=1
shadows_size=10
shadows_blur=15
shadowscolor=0x2c302c70

border_radius=12
no_radius_when_single=0
focused_opacity=0.8
unfocused_opacity=0.8

# --- Animation Configuration ---
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=0
animation_fade_out=0
tag_animation_direction=1
animation_duration_move=400
animation_duration_open=350
animation_duration_tag=350
animation_duration_close=400
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1

# --- Scroller Layout Setting ---
scroller_structs=20
scroller_default_proportion=0.5
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.33333,0.5,0.66667

# --- Gaps & Borders ---
gappih=8
gappiv=8
gappoh=8
gappov=8
borderpx=3

# --- Theme Colors (Auto-managed by morandi-gen.py) ---
focuscolor=0xb9c7b7ff
bordercolor=0x323832ff
shadowscolor=0x2c302c70
rootcolor=0x181a18ff
urgentcolor=0xb24355ff
overlaycolor=0xb9c7b7ff
scratchpadcolor=0xbbc3baff

# --- Input Configuration ---
repeat_rate=25
repeat_delay=600
numlockon=1
xkb_rules_layout=us

# Trackpad
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
disable_while_typing=1

# Mouse
mouse_natural_scrolling=0
warpcursor=0
mouse_accel_profile=flat

# --- Monitor Configuration ---
monitorrule=name:HDMI-A-1,scale:1
#monitorrule=name:DP-1,width:2560,height:1440,refresh:360,scale:1

# --- Environment Variables ---
env=PATH,/home/lanrhyme/.local/bin:/home/lanrhyme/.npm-global/bin:/usr/local/bin:/usr/bin:/bin
env=XMODIFIERS,@im=fcitx
env=QT_IM_MODULE,fcitx
env=GTK_IM_MODULE,fcitx
env=SDL_IM_MODULE,fcitx
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=QT_QPA_PLATFORM,wayland
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=XDG_SESSION_TYPE,wayland
env=XDG_CURRENT_DESKTOP,mangowm
env=QT_QPA_PLATFORMTHEME,gtk3
env=_JAVA_AWT_WM_NONREPARENTING,1

# --- Autostart ---
exec-once=/usr/lib/polkit-kde-authentication-agent-1
exec-once=noctalia
exec-once=clipse
exec-once=fcitx5 -d

# --- Key Bindings ---
# reload config
bind=SUPER,r,reload_config

# Exit / Power
bind=CTRL+ALT,Delete,quit
bind=SUPER,m,quit

# Applications
bind=SUPER,Return,spawn,ghostty
bind=SUPER+CTRL,Return,spawn,noctalia msg panel-toggle launcher
bind=SUPER,B,spawn,firefox
bind=SUPER+ALT,L,spawn,noctalia msg session lock
bind=SUPER+SHIFT,Q,spawn,noctalia msg panel-toggle sessionMenu
bind=SUPER,A,spawn,noctalia msg panel-toggle control-center
bind=SUPER,E,spawn,nautilus
bind=SUPER,V,spawn,noctalia msg panel-toggle clipboard

# Media Controls (allow when locked)
bindl=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bindl=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bindl=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bindl=NONE,XF86AudioMicMute,spawn,noctalia msg mic-mute
bindl=NONE,XF86AudioNext,spawn,noctalia msg media next
bindl=NONE,XF86AudioPrev,spawn,noctalia msg media previous
bindl=NONE,XF86AudioPlay,spawn,noctalia msg media toggle
bindl=NONE,XF86AudioPause,spawn,noctalia msg media toggle

# Brightness Controls (allow when locked)
bindl=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bindl=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down

# Window Focus & Management
bind=SUPER,Q,killclient
bind=SUPER,Left,focusdir,left
bind=SUPER,h,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,l,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,k,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,j,focusdir,down

# Window Movement
bind=SUPER+CTRL,Left,exchange_client,left
bind=SUPER+CTRL,h,exchange_client,left
bind=SUPER+CTRL,Right,exchange_client,right
bind=SUPER+CTRL,l,exchange_client,right
bind=SUPER+CTRL,Up,exchange_client,up
bind=SUPER+CTRL,k,exchange_client,up
bind=SUPER+CTRL,Down,exchange_client,down
bind=SUPER+CTRL,j,exchange_client,down

# Monitor Focus & Movement
bind=SUPER+SHIFT,Left,focusmon,left
bind=SUPER+SHIFT,Right,focusmon,right
bind=SUPER+SHIFT,Up,focusmon,up
bind=SUPER+SHIFT,Down,focusmon,down

bind=SUPER+SHIFT+CTRL,Left,tagmon,left
bind=SUPER+SHIFT+CTRL,Right,tagmon,right
bind=SUPER+SHIFT+CTRL,Up,tagmon,up
bind=SUPER+SHIFT+CTRL,Down,tagmon,down

# Tag (Workspace) Focus
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# Move Window to Tag (Workspace)
bind=SUPER+CTRL,1,tag,1,0
bind=SUPER+CTRL,2,tag,2,0
bind=SUPER+CTRL,3,tag,3,0
bind=SUPER+CTRL,4,tag,4,0
bind=SUPER+CTRL,5,tag,5,0
bind=SUPER+CTRL,6,tag,6,0
bind=SUPER+CTRL,7,tag,7,0
bind=SUPER+CTRL,8,tag,8,0
bind=SUPER+CTRL,9,tag,9,0

# Tag Back & Forth
bind=SUPER,Tab,view,-1,0

# Layout & Window Status Controls
bind=SUPER,t,togglefloating,
bind=SUPER,f,togglemaximizescreen,
bind=SUPER+CTRL,f,togglefullscreen,
bind=SUPER,o,toggleoverview,
bind=SUPER,c,centerwin

# Scroller window proportion resizes
bind=SUPER,e,set_proportion,1.0
bind=SUPER,x,switch_proportion_preset,

# Gaps Adjustments
bind=SUPER+SHIFT,X,incgaps,1
bind=SUPER+SHIFT,Z,incgaps,-1
bind=SUPER+SHIFT,R,togglegaps

# Screenshots
bind=SUPER,Print,spawn,mark-shot

# Kando Pie Menu
bind=SUPER+SHIFT,Z,spawn,kando --menu Krita

# UGEE Bridge Toggle
bind=SUPER+SHIFT,U,spawn,/home/lanrhyme/.local/bin/ugee-bridge-toggle

# --- Mouse Bindings ---
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

# --- Window Rules ---
# Global default rules are handled by global options (focused_opacity, unfocused_opacity, blur)
# App-specific overrides:
windowrule=focused_opacity:1.0,unfocused_opacity:1.0,noblur:1,appid:org.kde.krita
windowrule=isfloating:1,isoverlay:1,focused_opacity:1.0,unfocused_opacity:1.0,noblur:1,appid:menu.kando.Kando
windowrule=isfloating:1,isoverlay:1,focused_opacity:1.0,unfocused_opacity:1.0,noblur:1,appid:splayer,title:.*桌面歌词.*

# --- Layout ---
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:scroller
tagrule=id:7,layout_name:scroller
tagrule=id:8,layout_name:scroller
tagrule=id:9,layout_name:scroller

bind=SUPER,n,switch_layout
