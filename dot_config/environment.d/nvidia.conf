# NVIDIA PRIME 渲染卸载配置
#
# 2026-10-29 变更：默认不再把整个用户会话强制到独显
# 原因：面板 eDP-1 挂在核显(card1 i915)，niri 也在核显合成
# 全局强制独显会让每一帧都走「独显渲染 -> PCIe 导出 dmabuf -> 核显导入合成 -> 输出」
# 且独显长期停在 P5 低时钟，实测移动鼠标时核显合成负载直接翻倍并超实时线导致掉帧
#
# 需要独显的应用请显式用 prime-run 启动，例如
#   prime-run krita
#   prime-run blender
#   Steam 游戏在「启动选项」里填：prime-run %command%
#
# 已停用的全局强制项（保留记录便于回溯）
# __NV_PRIME_RENDER_OFFLOAD=1
# __GLX_VENDOR_LIBRARY_NAME=nvidia
# __VK_LAYER_NV_optimus=NVIDIA_only
# DRI_PRIME=pci-0000:01:00.0

# Xwayland 下禁用 MIT-SHM 可避免共享内存路径的图形异常，保留
QT_X11_NO_MITSHM=1
