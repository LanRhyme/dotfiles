# ────────────── Input & Touchpad ──────────────
input {
    kb_layout = us
    numlock_by_default = true
    follow_mouse = 1

    sensitivity = 0.0 # -1.0 to 1.0, 0 means no modification.
    accel_profile = flat # Flat linear mouse curve

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = false
        scroll_factor = 1.0
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
}
