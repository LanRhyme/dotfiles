# ────────────── Smooth Fluid Animations ──────────────
animations {
    enabled = true

    # Highly tuned Bezier curves for 144Hz fluid physics
    bezier = fluent, 0.16, 1, 0.3, 1
    bezier = easeOutQuart, 0.25, 1, 0.5, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = smoothFade, 0.2, 0.8, 0.4, 1
    bezier = liner, 1, 1, 1, 1

    # Windows
    animation = windows, 1, 5, fluent, slide
    animation = windowsIn, 1, 4.5, fluent, popin 85%
    animation = windowsOut, 1, 3.5, easeOutQuart, popin 85%
    animation = windowsMove, 1, 4.5, fluent, slide

    # Fade & Focus Opacity transitions (Super smooth)
    animation = fadeIn, 1, 3.2, smoothFade
    animation = fadeOut, 1, 2.8, smoothFade
    animation = fade, 1, 3.5, smoothFade
    animation = fadeDim, 1, 3.5, smoothFade

    # Borders & Layers
    animation = border, 1, 1, liner
    animation = borderangle, 1, 30, liner, loop
    animation = layers, 1, 4, fluent
    animation = layersIn, 1, 4, fluent, fade
    animation = layersOut, 1, 3, easeOutQuart, fade

    # Workspaces
    animation = workspaces, 1, 4.5, overshot, slidevert
    animation = specialWorkspace, 1, 4, overshot, slidefadevert 20%
}
