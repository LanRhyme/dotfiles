# ────────────── Smooth Fluid Animations ──────────────
animations {
    enabled = true

    # Highly tuned fluid Bezier curves for 144Hz high-refresh displays
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.05
    bezier = winOut, 0.3, -0.2, 0, 1
    bezier = liner, 1, 1, 1, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1

    animation = windows, 1, 4.5, wind, slide
    animation = windowsIn, 1, 4.2, winIn, slide
    animation = windowsOut, 1, 3.2, smoothOut, slide
    animation = windowsMove, 1, 4.5, wind, slide
    animation = border, 1, 1, liner
    animation = borderangle, 1, 30, liner, loop
    animation = fade, 1, 3, smoothIn
    animation = workspaces, 1, 4.2, overshot, slidevert
}
