# ────────────── Keybindings ──────────────
$mainMod = SUPER

# Applications
bind = $mainMod, RETURN, exec, ghostty
bind = $mainMod, B, exec, /home/lanrhyme/.local/bin/zen
bind = $mainMod, E, exec, nautilus
bind = $mainMod, Q, killactive,
bind = $mainMod, A, exec, noctalia msg panel-toggle control-center
bind = $mainMod CTRL, RETURN, exec, noctalia msg panel-toggle launcher
bind = $mainMod SHIFT, Q, exec, noctalia msg panel-toggle sessionMenu
bind = $mainMod, V, exec, noctalia msg panel-toggle clipboard
bind = $mainMod, SPACE, exec, fcitx5-remote -t
bind = CTRL, SPACE, exec, fcitx5-remote -t

# Layout & Window state
bind = $mainMod, F, fullscreen, 1
bind = $mainMod CTRL, F, fullscreen, 0
bind = $mainMod, T, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit

# Custom utilities & menus
bind = $mainMod SHIFT, Z, exec, kando --menu Krita
bind = $mainMod SHIFT, U, exec, /home/lanrhyme/.local/bin/ugee-bridge-toggle
bind = $mainMod, PRINT, exec, grim -g "$(slurp)" - | wl-copy
bind = , PRINT, exec, grim - | wl-copy
bind = $mainMod, L, exec, noctalia msg session lock
bind = $mainMod ALT, L, exec, noctalia msg session lock

# Media & Hardware Keys
bindle = , XF86AudioRaiseVolume, exec, noctalia msg volume-up
bindle = , XF86AudioLowerVolume, exec, noctalia msg volume-down
bindl = , XF86AudioMute, exec, noctalia msg volume-mute
bindl = , XF86AudioMicMute, exec, noctalia msg mic-mute
bindle = , XF86MonBrightnessUp, exec, noctalia msg brightness-up
bindle = , XF86MonBrightnessDown, exec, noctalia msg brightness-down
bindl = , XF86AudioPlay, exec, noctalia msg media toggle
bindl = , XF86AudioNext, exec, noctalia msg media next
bindl = , XF86AudioPrev, exec, noctalia msg media previous

# Focus Movement
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u

# Window Movement
bind = $mainMod CTRL, left, movewindow, l
bind = $mainMod CTRL, right, movewindow, r
bind = $mainMod CTRL, up, movewindow, u
bind = $mainMod CTRL, down, movewindow, d
bind = $mainMod CTRL, H, movewindow, l
bind = $mainMod CTRL, L, movewindow, r
bind = $mainMod CTRL, K, movewindow, u
bind = $mainMod CTRL, J, movewindow, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move Window to Workspace
bind = $mainMod CTRL, 1, movetoworkspace, 1
bind = $mainMod CTRL, 2, movetoworkspace, 2
bind = $mainMod CTRL, 3, movetoworkspace, 3
bind = $mainMod CTRL, 4, movetoworkspace, 4
bind = $mainMod CTRL, 5, movetoworkspace, 5
bind = $mainMod CTRL, 6, movetoworkspace, 6
bind = $mainMod CTRL, 7, movetoworkspace, 7
bind = $mainMod CTRL, 8, movetoworkspace, 8
bind = $mainMod CTRL, 9, movetoworkspace, 9

# Scroll Workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
