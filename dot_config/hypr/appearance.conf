# ────────────── Appearance & Blur ──────────────
general {
    gaps_in = 5
    gaps_out = 8
    border_size = 2

    col.active_border = $activeBorderFrom $activeBorderTo 45deg
    col.inactive_border = $inactiveBorder

    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 10
    active_opacity = 0.98
    inactive_opacity = 0.94
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        xray = false
        noise = 0.012
        contrast = 0.95
        brightness = 0.95
        vibrancy = 0.25
        popups = true
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = $shadowColor
    }
}

dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 1
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}
