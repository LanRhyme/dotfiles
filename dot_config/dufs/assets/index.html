/* ==========================================================
   DUFS - NEOBRUTALISM THEME (新粗野主义设计风格)
   Designed for LanRhyme's WebDAV & File Manager
   ========================================================== */

:root {
  /* Light Mode (Neobrutalism Warm Paper) */
  --bg: #f8f6f0;
  --card-bg: #ffffff;
  --text: #121212;
  --text-muted: #555555;
  --border: #121212;
  --shadow: 4px 4px 0px #121212;
  --shadow-sm: 2px 2px 0px #121212;
  --shadow-hover: 5px 5px 0px #121212;
  --shadow-active: 1px 1px 0px #121212;

  /* Accent Palette */
  --accent-yellow: #ffe600;
  --accent-cyan: #5ce1e6;
  --accent-coral: #ff6b6b;
  --accent-green: #70e000;
  --accent-purple: #c77dff;
  --accent-blue: #3a86ff;
  
  --th-bg: #ffe600;
  --row-hover: #fff9db;
  --table-border: 2.5px solid var(--border);
}

@media (prefers-color-scheme: dark) {
  :root {
    /* Dark Mode (Cyber Neobrutalism) */
    --bg: #121316;
    --card-bg: #1c1d22;
    --text: #f4f4f5;
    --text-muted: #a1a1aa;
    --border: #e4e4e7;
    --shadow: 4px 4px 0px #000000;
    --shadow-sm: 2px 2px 0px #000000;
    --shadow-hover: 5px 5px 0px #000000;
    --shadow-active: 1px 1px 0px #000000;

    --accent-yellow: #facc15;
    --accent-cyan: #22d3ee;
    --accent-coral: #f87171;
    --accent-green: #4ade80;
    --accent-purple: #c084fc;
    --accent-blue: #60a5fa;

    --th-bg: #27272a;
    --row-hover: #2a2b32;
    --table-border: 2.5px solid #3f3f46;
  }
}

* {
  box-sizing: border-box;
}

html {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  line-height: 1.6;
  color: var(--text);
  background-color: var(--bg);
  background-image: radial-gradient(rgba(0, 0, 0, 0.06) 1.5px, transparent 0);
  background-size: 24px 24px;
  background-position: -12px -12px;
}

@media (prefers-color-scheme: dark) {
  html {
    background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1.5px, transparent 0);
  }
}

body {
  min-width: 320px;
  margin: 0;
  padding: 0 1rem;
}

.hidden {
  display: none !important;
}

/* ==========================================================
   Header Bar (Floating Card)
   ========================================================== */
.head {
  max-width: 1200px;
  margin: 1.2rem auto;
  padding: 0.75rem 1.25rem;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.8rem;
  background-color: var(--card-bg);
  border: 2.5px solid var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow);
  position: sticky;
  top: 1rem;
  z-index: 100;
  transition: all 0.15s ease;
}

/* Breadcrumb Navigation */
.breadcrumb {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 1.1rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.25rem;
}

.breadcrumb > a {
  color: var(--text);
  text-decoration: none;
  background: var(--bg);
  border: 2px solid var(--border);
  border-radius: 6px;
  padding: 2px 8px;
  box-shadow: 2px 2px 0px var(--border);
  transition: transform 0.1s, box-shadow 0.1s;
}

.breadcrumb > a:hover {
  background: var(--accent-yellow);
  color: #000;
  transform: translate(-1px, -1px);
  box-shadow: 3px 3px 0px var(--border);
}

.breadcrumb > a:active {
  transform: translate(1px, 1px);
  box-shadow: 1px 1px 0px var(--border);
}

.breadcrumb > b {
  color: var(--text);
  background: var(--accent-cyan);
  color: #000;
  border: 2px solid var(--border);
  border-radius: 6px;
  padding: 2px 8px;
  box-shadow: 2px 2px 0px var(--border);
}

.breadcrumb > .separator {
  color: var(--text-muted);
  font-weight: 800;
  padding: 0 0.15rem;
}

.breadcrumb svg {
  height: 16px;
  width: 16px;
  fill: currentColor;
  vertical-align: -2px;
}

/* ==========================================================
   Toolbox Buttons (Neobrutal Tactile Blocks)
   ========================================================== */
.toolbox {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.toolbox .control,
.toolbox > a.control {
  cursor: pointer;
  height: 36px;
  min-width: 36px;
  padding: 0 8px;
  background-color: var(--card-bg);
  color: var(--text);
  border: 2px solid var(--border);
  border-radius: 8px;
  box-shadow: var(--shadow-sm);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  font-weight: 700;
  transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
}

.toolbox .control:hover,
.toolbox > a.control:hover {
  transform: translate(-2px, -2px);
  box-shadow: var(--shadow-hover);
  background-color: var(--accent-yellow);
  color: #000;
}

.toolbox .control:active,
.toolbox > a.control:active {
  transform: translate(2px, 2px);
  box-shadow: var(--shadow-active);
}

.toolbox .control svg {
  fill: currentColor;
}

.toolbox .upload-file:hover {
  background-color: var(--accent-green) !important;
}

.toolbox .delete-file:hover {
  background-color: var(--accent-coral) !important;
}

.toolbox .move-file:hover {
  background-color: var(--accent-purple) !important;
}

.upload-file input {
  display: none;
}

.upload-file label {
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
}

/* ==========================================================
   Search Bar
   ========================================================== */
.searchbar {
  display: flex;
  align-items: center;
  width: 250px;
  height: 36px;
  background-color: var(--card-bg);
  border: 2px solid var(--border);
  border-radius: 8px;
  box-shadow: var(--shadow-sm);
  padding: 0 8px;
  transition: all 0.15s ease;
}

.searchbar:focus-within {
  transform: translate(-2px, -2px);
  box-shadow: var(--shadow-hover);
  border-color: var(--border);
  background-color: var(--card-bg);
}

.searchbar .icon {
  display: flex;
  align-items: center;
  color: var(--text);
  margin-right: 6px;
}

.searchbar svg {
  fill: currentColor;
}

.searchbar #search {
  width: 100%;
  height: 100%;
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--text);
  background: transparent;
  border: none;
  outline: none;
}

.searchbar #search::placeholder {
  color: var(--text-muted);
}

/* Right Toolbox (User & Login) */
.toolbox-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 0.6rem;
}

.logout-btn,
.login-btn {
  cursor: pointer;
  height: 36px;
  padding: 0 12px;
  background: var(--accent-purple);
  color: #000;
  border: 2px solid var(--border);
  border-radius: 999px;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 800;
  font-size: 0.9rem;
  transition: all 0.1s ease;
}

.logout-btn:hover,
.login-btn:hover {
  transform: translate(-2px, -2px);
  box-shadow: var(--shadow-hover);
  filter: brightness(1.08);
}

.logout-btn:active,
.login-btn:active {
  transform: translate(2px, 2px);
  box-shadow: var(--shadow-active);
}

.logout-btn svg,
.login-btn svg {
  fill: #000;
}

.save-btn {
  cursor: pointer;
  height: 36px;
  padding: 0 12px;
  background: var(--accent-green);
  color: #000;
  border: 2px solid var(--border);
  border-radius: 8px;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  font-weight: 800;
  transition: all 0.1s ease;
}

/* ==========================================================
   Main Content & Paths Table
   ========================================================== */
.main {
  max-width: 1200px;
  margin: 0 auto 3rem auto;
  padding: 0;
}

.index-page {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.empty-folder {
  font-family: ui-monospace, SFMono-Regular, monospace;
  font-size: 1rem;
  font-weight: 600;
  color: var(--text-muted);
  text-align: center;
  padding: 3rem 1rem;
  background: var(--card-bg);
  border: 2.5px dashed var(--border);
  border-radius: 12px;
}

.paths-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  background-color: var(--card-bg);
  border: 2.5px solid var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: box-shadow 0.2s ease;
}

.paths-table th {
  padding: 12px 16px;
  font-size: 0.85rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #000;
  background-color: var(--th-bg);
  border-bottom: 2.5px solid var(--border);
  white-space: nowrap;
}

@media (prefers-color-scheme: dark) {
  .paths-table th {
    color: var(--text);
  }
}

.paths-table th a {
  color: inherit;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
}

.paths-table th a:hover {
  text-decoration: underline;
}

.paths-table td {
  padding: 10px 16px;
  border-bottom: 1.5px solid rgba(0, 0, 0, 0.08);
  white-space: nowrap;
  font-size: 0.95rem;
}

@media (prefers-color-scheme: dark) {
  .paths-table td {
    border-bottom: 1.5px solid rgba(255, 255, 255, 0.08);
  }
}

.paths-table tbody tr:last-child td {
  border-bottom: none;
}

.paths-table tbody tr {
  transition: background-color 0.1s ease;
}

.paths-table tbody tr:hover {
  background-color: var(--row-hover);
}

/* File Name Link */
.path {
  list-style: none;
}

.path a {
  color: var(--text);
  font-weight: 700;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: calc(100vw - 380px);
  min-width: 180px;
}

.path a:hover {
  color: var(--accent-blue);
  text-decoration: underline;
}

.path svg {
  height: 18px;
  width: 18px;
  fill: var(--text);
  margin-right: 8px;
  vertical-align: middle;
  flex-shrink: 0;
}

.paths-table .cell-mtime {
  width: 140px;
  color: var(--text-muted);
  font-family: ui-monospace, SFMono-Regular, monospace;
  font-size: 0.88rem;
}

.paths-table .cell-size {
  width: 90px;
  text-align: right;
  font-family: ui-monospace, SFMono-Regular, monospace;
  font-weight: 600;
  color: var(--text-muted);
  font-size: 0.88rem;
}

/* Row Action Buttons */
.paths-table .cell-actions {
  width: 100px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.action-btn {
  cursor: pointer;
  padding: 3px 6px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 6px;
  box-shadow: 1.5px 1.5px 0px var(--border);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.1s ease;
}

.action-btn:hover {
  background: var(--accent-yellow);
  transform: translate(-1px, -1px);
  box-shadow: 2.5px 2.5px 0px var(--border);
}

.action-btn:active {
  transform: translate(1px, 1px);
  box-shadow: 0px 0px 0px var(--border);
}

.action-btn svg {
  height: 14px;
  width: 14px;
  fill: var(--text);
}

/* ==========================================================
   Upload Progress Table
   ========================================================== */
.uploaders-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  background: var(--card-bg);
  border: 2.5px solid var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow);
  margin-bottom: 1rem;
  overflow: hidden;
}

.uploaders-table th {
  padding: 10px 16px;
  background: var(--accent-coral);
  color: #000;
  font-weight: 800;
  border-bottom: 2.5px solid var(--border);
}

.uploaders-table td {
  padding: 8px 16px;
  font-weight: 600;
  border-bottom: 1px solid rgba(0, 0, 0, 0.08);
}

/* ==========================================================
   Editor Page
   ========================================================== */
.editor {
  width: 100%;
  height: calc(100vh - 6.5rem);
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 0.95rem;
  line-height: 1.6;
  color: var(--text);
  background: var(--card-bg);
  border: 2.5px solid var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow);
  outline: none;
  padding: 1rem;
  resize: vertical;
}

.not-editable {
  font-family: ui-monospace, SFMono-Regular, monospace;
  font-weight: 700;
  color: var(--accent-coral);
  padding: 1rem;
  border: 2px solid var(--border);
  border-radius: 8px;
  background: var(--card-bg);
  box-shadow: var(--shadow-sm);
  margin-bottom: 1rem;
}

/* ==========================================================
   Responsive Adaptations
   ========================================================== */
@media (max-width: 768px) {
  body {
    padding: 0 0.5rem;
  }

  .head {
    margin: 0.8rem auto;
    padding: 0.6rem 0.8rem;
    gap: 0.5rem;
  }

  .searchbar {
    width: 100%;
    order: 4;
  }

  .paths-table {
    box-shadow: 3px 3px 0px var(--border);
  }

  .paths-table th,
  .paths-table td {
    padding: 8px 10px;
  }

  .path a {
    min-width: 120px;
    max-width: calc(100vw - 200px);
  }
}
</style>
</head>
